apiVersion: v1
kind: Pod
metadata:
  name: restricted-app
  namespace: production
spec:
  containers:
  - name: app
    image: nginx
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      runAsNonRoot: true
  volumes:
  - name: config
    configMap:
      name: app-config
