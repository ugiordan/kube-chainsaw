apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: certificate-and-token-manager
rules:
- apiGroups:
  - ""
  resources:
  - serviceaccounts/token
  - pods/portforward
  verbs:
  - get
  - create
- apiGroups:
  - certificates.k8s.io
  resources:
  - certificatesigningrequests/approval
  verbs:
  - update
