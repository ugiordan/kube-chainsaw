apiVersion: v1
kind: Pod
metadata:
  name: privileged-debug
  namespace: production
spec:
  hostNetwork: true
  hostPID: true
  containers:
  - name: debug
    image: busybox
    securityContext:
      privileged: true
      capabilities:
        add:
        - SYS_ADMIN
        - NET_RAW
    volumeMounts:
    - name: host-root
      mountPath: /host
  volumes:
  - name: host-root
    hostPath:
      path: /
      type: Directory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capability-worker
  namespace: production
spec:
  selector:
    matchLabels:
      app: capability-worker
  template:
    metadata:
      labels:
        app: capability-worker
    spec:
      containers:
      - name: worker
        image: busybox
        securityContext:
          capabilities:
            add:
            - SYS_PTRACE
