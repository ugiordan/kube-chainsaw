apiVersion: v1
kind: Service
metadata:
  name: public-api
  namespace: production
spec:
  type: LoadBalancer
  externalIPs:
  - 203.0.113.10
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catch-all
  namespace: production
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: public-api
            port:
              number: 80
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: wildcard-api
  namespace: production
spec:
  wildcardPolicy: Subdomain
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Allow
  to:
    kind: Service
    name: public-api
