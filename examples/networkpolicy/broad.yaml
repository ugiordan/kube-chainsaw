apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all-ingress
  namespace: payments
spec:
  podSelector: {}
  ingress:
  - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-egress
  namespace: payments
spec:
  podSelector:
    matchLabels:
      app: worker
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: networkpolicy-manager
rules:
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - get
  - list
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: networkpolicy-manager-binding
subjects:
- kind: ServiceAccount
  name: networkpolicy-manager
  namespace: payments
roleRef:
  kind: ClusterRole
  name: networkpolicy-manager
  apiGroup: rbac.authorization.k8s.io
