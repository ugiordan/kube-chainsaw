apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: certificate-and-token-manager
rules:
- apiGroups:
  - ""
  resources:
  - serviceaccounts/token
  - pods/portforward
  verbs:
  - create
- apiGroups:
  - certificates.k8s.io
  resources:
  - signers
  - certificatesigningrequests/approval
  - certificatesigningrequests/status
  verbs:
  - approve
  - sign
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: certificate-and-token-manager-binding
subjects:
- kind: ServiceAccount
  name: certificate-and-token-manager
  namespace: production
roleRef:
  kind: ClusterRole
  name: certificate-and-token-manager
  apiGroup: rbac.authorization.k8s.io
