apiVersion: v1
kind: Pod
metadata:
  name: restricted-app
  namespace: production
spec:
  containers:
  - name: app
    image: nginx
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      runAsNonRoot: true
  volumes:
  - name: config
    configMap:
      name: app-config
---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: application-restricted
allowPrivilegedContainer: false
allowHostNetwork: false
allowHostPID: false
allowHostIPC: false
allowHostDirVolumePlugin: false
allowHostPorts: false
allowPrivilegeEscalation: false
defaultAllowPrivilegeEscalation: false
allowedCapabilities: []
seccompProfiles:
- runtime/default
volumes:
- configMap
- emptyDir
runAsUser:
  type: MustRunAsRange
seLinuxContext:
  type: MustRunAs
groups:
- system:serviceaccounts:production
---
apiVersion: v1
kind: Secret
metadata:
  name: opaque-config
  namespace: production
type: Opaque
data:
  config: Y29uZmln
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: token-reader
rules:
- apiGroups:
  - ""
  resources:
  - serviceaccounts/token
  verbs:
  - get
  - list
  - watch
